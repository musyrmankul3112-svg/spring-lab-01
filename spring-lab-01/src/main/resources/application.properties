spring.application.name=spring-lab-01
server.port=9090
app.owner=Zhanerke Bakhtiyarkyzy, IT1-2407IS
logging.level.web=INFO

spring.messages.basename=messages
spring.messages.encoding=UTF-8

spring.datasource.url=jdbc:postgresql://localhost:5432/springlab
spring.datasource.username=springlab
spring.datasource.password=springlab

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.profiles.active=dev